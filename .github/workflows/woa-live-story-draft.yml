name: Prepare WOA live story review

on:
  repository_dispatch:
    types: [woa_story_message]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: woa-live-story-review
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: ubuntu-latest
    steps:
      - name: Update the unpublished story draft and pull request
        uses: actions/github-script@v7
        with:
          script: |
            const input = context.payload.client_payload ?? {};
            const key = input.story_key;
            const title = input.title;
            const messages = input.messages;
            if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(key ?? '') ||
                typeof title !== 'string' || title.length < 1 || title.length > 120 ||
                !Array.isArray(messages) || messages.length < 1 || messages.length > 20) {
              throw new Error('Invalid story review payload');
            }
            for (const item of messages) {
              if (!item || !/^[a-f0-9-]{36}$/i.test(item.id ?? '') ||
                  typeof item.created_at !== 'string' ||
                  !['agent', 'participant'].includes(item.role) ||
                  typeof item.text !== 'string' || !item.text.trim() || item.text.length > 20000) {
                throw new Error('Invalid story message');
              }
            }

            const { owner, repo } = context.repo;
            const branch = `bot/woa-live-story-${key}`;
            const filePath = 'story/live-story.json';
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const base = repoInfo.data.default_branch;
            const baseRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });
            const baseSha = baseRef.data.object.sha;
            const pullRequests = await github.rest.pulls.list({ owner, repo, state: 'open', base, per_page: 100 });
            let pullRequest = pullRequests.data.find((pr) => pr.head.ref === branch && pr.head.repo?.full_name === `${owner}/${repo}`);

            let headSha;
            try {
              const existingRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              headSha = existingRef.data.object.sha;
              if (!pullRequest) {
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: baseSha, force: true });
                headSha = baseSha;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: baseSha });
              headSha = baseSha;
            }

            let story = { schema_version: 1, story_key: key, title, messages: [] };
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path: filePath, ref: branch });
              if (!Array.isArray(current.data) && current.data.type === 'file') {
                story = JSON.parse(Buffer.from(current.data.content, 'base64').toString('utf8'));
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const known = new Set(story.messages.map((item) => item.id));
            let added = 0;
            for (const item of messages) {
              if (!known.has(item.id)) {
                story.messages.push(item);
                known.add(item.id);
                added += 1;
              }
            }
            if (added === 0) {
              core.info('No new message IDs; the review draft is already current.');
              return;
            }
            story.messages.sort((a, b) => a.created_at.localeCompare(b.created_at) || a.id.localeCompare(b.id));
            story.title = title;
            story.story_key = key;
            story.schema_version = 1;

            const blob = await github.rest.git.createBlob({ owner, repo, content: JSON.stringify(story, null, 2) + '\n', encoding: 'utf-8' });
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: headSha,
              tree: [{ path: filePath, mode: '100644', type: 'blob', sha: blob.data.sha }],
            });
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'Update WOA live story review draft', tree: tree.data.sha, parents: [headSha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false });

            const preview = messages.map((item) => `<pre>${item.text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`).join('\n');
            const body = [
              'This draft was assembled automatically from Eric’s selected conversation.',
              '',
              'The transcript text is preserved as written and deduplicated by message ID.',
              'Review the new turns below and the complete JSON diff. Merge this pull request to publish the approved turns on the WOA website.',
              '',
              'The public page remains unchanged until this pull request is merged.',
              '',
              '## New turns',
              preview,
            ].join('\n');

            if (!pullRequest) {
              const result = await github.rest.pulls.create({
                owner, repo, head: branch, base,
                title: `Review live story: ${title}`,
                body,
              });
              pullRequest = result.data;
            } else {
              await github.rest.pulls.update({ owner, repo, pull_number: pullRequest.number, body });
            }
            core.notice(`Updated story review pull request #${pullRequest.number} with ${story.messages.length} turns.`);
