<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WOA — Game Features List Card v1</title>
  <link rel="stylesheet" href="single-card-game-features-v1.css">
</head>
<body>
  <main class="page">
    <p class="eyebrow">WORMS ON ACID · COMPONENT TEST</p>
    <h1>Game features list</h1>
    <p class="intro">Reusable parchment feature panel for game cards. Prototype only.</p>

    <section class="features-card features-card--tilt-left" aria-labelledby="features-title">
      <h2 class="features-card__title" id="features-title">FEATURES</h2>
      <ul class="features-card__list">
        <li><span class="feature-icon feature-icon--difficulty" aria-hidden="true">✣</span><span>Increasing difficulty</span></li>
        <li><span class="feature-icon feature-icon--birds" aria-hidden="true">♥</span><span>Special birds</span></li>
        <li><span class="feature-icon feature-icon--objects" aria-hidden="true">▣</span><span>Surprise objects</span></li>
        <li><span class="feature-icon feature-icon--leaderboard" aria-hidden="true">↧</span><span>Leaderboard</span></li>
        <li><span class="feature-icon feature-icon--share" aria-hidden="true">•</span><span>Share your score</span></li>
      </ul>
    </section>

    <p class="note">Prototype only · Live website unchanged</p>
  </main>
</body>
</html>
