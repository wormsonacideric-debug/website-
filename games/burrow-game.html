<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Burrow</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#160d09;--fg:#ffe9cf;--card:#33201a;--acc:#ff7a1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3e3cf;--fg:#2b1a10;--card:#e6cfb3;color-scheme:light}}
:root[data-theme=dark]{--bg:#160d09;--fg:#ffe9cf;--card:#33201a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;font-family:'Bowlby One',Impact,'Arial Black',sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#mini{inset:auto;left:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:112px;height:112px;display:none;border-radius:10px;background:#0009;border:2px solid #ff7a1a;pointer-events:none}
#hud{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));display:none;flex-direction:column;gap:4px;font-size:12px;pointer-events:none}
.row{display:flex;align-items:center;gap:6px;background:#0008;color:#ffe9cf;padding:2px 8px 2px 4px;border-radius:99px;min-width:110px}
.row img{width:20px;height:20px;object-fit:contain}.row b{font-weight:400;margin-left:auto}.row.me{outline:2px solid #fff8}
#mine{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;font:inherit;font-size:16px;padding:16px 20px;border:0;border-radius:99px;background:var(--acc);color:#2b1204}
#mine:disabled{opacity:.35}
#toast{position:fixed;left:0;right:0;top:22%;text-align:center;font-size:22px;color:#ffe9cf;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .25s;pointer-events:none}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);padding:16px;text-align:center;overflow:auto}
h1{font-weight:400;font-size:clamp(44px,14vw,80px);margin:0;color:var(--acc);letter-spacing:-1px}
#menu p{margin:0;max-width:30ch;font-family:system-ui,sans-serif;font-size:15px;line-height:1.4}
#pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(440px,100%)}
.c{background:var(--card);border:3px solid transparent;border-radius:14px;padding:8px 2px 6px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:inherit;font-family:inherit}
.c img{width:100%;height:52px;object-fit:contain}.c.on{border-color:var(--cc)}
#go{font:inherit;font-size:22px;padding:14px 44px;border:0;border-radius:99px;background:var(--acc);color:#2b1204}
#dead{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000a;text-align:center;padding:16px}#dead h2{font-weight:400;font-size:clamp(34px,10vw,56px);margin:0;color:#ff7a1a}#dead p{margin:0 0 8px;font-family:system-ui,sans-serif;font-size:16px;color:#ffe9cf}#dead button{font:inherit;font-size:22px;padding:14px 44px;border:0;border-radius:99px;background:#ff7a1a;color:#2b1204}#dead .alt{background:#ffe9cf33;color:#ffe9cf;font-size:15px;padding:10px 26px}
</style></head><body>
<canvas id="cv"></canvas><canvas id="mini"></canvas><div id="hud"></div><div id="toast"></div><button id="mine">💣 Mine</button><div id="dead"><h2 id="dt"></h2><p id="ds"></p><button id="rp">Replay</button><button id="chg" class="alt">Change worm</button></div>
<div id="menu"><h1>BURROW</h1><p>Dig out of your patch, loop back and claim the soil. Cut a tunnel and its worm is toast.</p><div id="pick"></div><button id="go">Dig in</button><p>Drag anywhere to steer in any direction (or use arrow keys). Grab donuts to drop a blob of land. Kill a worm and take its land.</p></div>

let peak=0;function showDead(k){if(!running)return;$('dt').textContent=k?CH[P[k-1].ch][1]+' got you':'Wiped out';$('ds').textContent='You held '+peak.toFixed(1)+'% of '+cname;$('dead').style.display='flex'}
$('rp').onclick=()=>start();$('chg').onclick=()=>{$('dead').style.display='none';running=false;$('menu').style.display='flex';$('hud').style.display='none';$('mine').style.display='none';mini.style.display='none'};
function upd(dt,now){for(const p of P){if(!p.alive){if(now>p.rt&&!spawn(p))p.rt=now+600;continue}
if(p.bot)ai(p,dt,now);let d=p.tang-p.ang;d=Math.atan2(Math.sin(d),Math.cos(d));const mt=(p.bot?8:12)*dt;p.ang+=Math.max(-mt,Math.min(mt,d));
let rem=(p.boost>now?1.55:1)*SPD*dt;while(rem>0&&p.alive){const s=Math.min(.4,rem);rem-=s;const nx=p.x+Math.cos(p.ang)*s,ny=p.y+Math.sin(p.ang)*s,qx=p.x,qy=p.y;if(pl(nx,ny)){p.x=nx;p.y=ny}else if(pl(nx,p.y))p.x=nx;else if(pl(p.x,ny))p.y=ny;p.dist+=Math.hypot(p.x-qx,p.y-qy);step(p,now)}}
mines=mines.filter(z=>z.e>now);if(Math.random()<dt*.8&&bubbles.length<28)newBubble();
parts=parts.filter(q=>(q.l-=dt*1.8)>0);for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt}}
function frame(now){requestAnimationFrame(frame);if(!running)return;const dt=Math.min(.05,(now-last)/1000);last=now;if(!endAt)upd(dt,now);else if(now>endAt){if(win)lv++;start();return}if(dirty){unify();paint()}
if(now-sc>400){sc=now;const cnt=new Array(P.length).fill(0);for(let i=0;i<own.length;i++)if(own[i])cnt[own[i]-1]++;
const ord=P.map(p=>p.id).sort((a,b)=>cnt[b]-cnt[a]);P.forEach(p=>{const pc=cnt[p.id]/tot*100;if(p.id==me&&pc>peak)peak=pc;p.row.style.order=ord.indexOf(p.id);p.row.style.display=ord.indexOf(p.id)<4||p.id==me?'flex':'none';p.row.children[1].style.width=Math.min(60,pc*2.5)+'px';p.row.lastChild.textContent=pc.toFixed(1)+'%'});if(!endAt){const w=cnt.findIndex(c=>c>=tot*.99);if(w>=0){endAt=now+3200;win=w==me;say(win?'Level complete!':CH[P[w].ch][1]+' filled the board');clearTimeout(say.t)}}$('mine').textContent='💣 Mine ×'+P[me].mines;$('mine').disabled=P[me].mines<1}
draw(now)}
function spr(im,x,y,wc,rot){if(!im.complete)return;const w=wc*C,h=w*im.height/im.width;ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}
function draw(now){drawMini();const w=innerWidth,h=innerHeight;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0d0705';ctx.fillRect(0,0,w,h);
const hp=P[me];if(hp.alive){cam.x+=(hp.x-cam.x)*.18;cam.y+=(hp.y-cam.y)*.18}
const ox=w/2-cam.x*C,oy=h/2-cam.y*C,S=N*C;ctx.save();ctx.translate(ox,oy);ctx.scale(C,C);ctx.imageSmoothingEnabled=true;if(maskPath)ctx.clip(maskPath);ctx.drawImage(mc,0,0,N,N);ctx.restore();
ctx.strokeStyle='rgba(255,233,207,.06)';ctx.lineWidth=1;ctx.beginPath();
for(let g=0;g<0;g+=4){const gx=ox+g*C,gy=oy+g*C;if(gx>=0&&gx<=w){ctx.moveTo(gx,Math.max(oy,0));ctx.lineTo(gx,Math.min(oy+S,h))}if(gy>=0&&gy<=h){ctx.moveTo(Math.max(ox,0),gy);ctx.lineTo(Math.min(ox+S,w),gy)}}ctx.stroke();
ctx.save();ctx.translate(ox,oy);ctx.scale(C,C);if(maskPath)ctx.clip(maskPath);ctx.lineJoin='round';ctx.lineWidth=.3;for(const t of TP){ctx.fillStyle=t.c;ctx.fill(t.path);ctx.strokeStyle=t.d;ctx.stroke(t.path)}ctx.restore();
ctx.save();ctx.translate(ox,oy);ctx.scale(C,C);ctx.lineJoin='round';if(maskPath){ctx.strokeStyle='#ff7a1a';ctx.lineWidth=.7;ctx.stroke(maskPath)}ctx.restore();
ctx.lineJoin=ctx.lineCap='round';
for(const p of P){if(!p.alive||!p.path.length)continue;ctx.strokeStyle=CH[p.ch][2];ctx.beginPath();ctx.moveTo(ox+p.path[0][0]*C,oy+p.path[0][1]*C);for(const q of p.path)ctx.lineTo(ox+q[0]*C,oy+q[1]*C);ctx.lineTo(ox+p.x*C,oy+p.y*C);ctx.globalAlpha=1;ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=C*1.45;ctx.stroke();ctx.strokeStyle=CH[p.ch][2];ctx.lineWidth=C*.95;ctx.stroke()}ctx.globalAlpha=1;
for(const z of mines)if(z.o==me){const x=ox+z.x*C,y=oy+z.y*C;ctx.fillStyle='#000b';ctx.beginPath();ctx.arc(x,y,C*.9,0,7);ctx.fill();ctx.fillStyle='#ff4a2a';ctx.beginPath();ctx.arc(x,y,C*.3,0,7);ctx.fill()}
const t=calm?0:now/1000;for(const b of bubbles){const bx=ox+b.x*C,by=oy+b.y*C+Math.sin(t*2+b.s)*C*.35;if(bx<-60||bx>w+60||by<-60||by>h+60)continue;
ctx.fillStyle='rgba(255,255,255,.17)';ctx.beginPath();ctx.arc(bx,by,C*2.2,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.stroke();spr(img.donut,bx,by,3.3)}
for(const p of P){if(!p.alive)continue;const sx=ox+p.x*C,sy=oy+p.y*C;
ctx.fillStyle=CH[p.ch][2]+'55';ctx.beginPath();ctx.arc(sx,sy,C*2.5,0,7);ctx.fill();ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(sx,sy+C*2,C*2,C*.55,0,0,7);ctx.fill();
if(p.boost>now){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,C*3.2,0,7);ctx.stroke()}
if(p.id==me){ctx.fillStyle=CH[p.ch][2]+'33';ctx.strokeStyle=CH[p.ch][2];ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,C*2.9,0,7);ctx.fill();ctx.stroke()}
spr(img[CH[p.ch][0]],sx,sy,4.8,Math.cos(p.ang)*.14+Math.sin(t*10+p.id)*.04)}
for(const q of parts){ctx.globalAlpha=q.l;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(ox+q.x*C,oy+q.y*C,C*.5*q.l+1,0,7);ctx.fill()}ctx.globalAlpha=1}
requestAnimationFrame(frame);
</script></body></html>
