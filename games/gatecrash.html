<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gatecrash — WORMS ON ACID</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101713;color:#f5e8c7;font:18px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:16px}.game{width:min(100%,720px);text-align:center}.back{color:#d5f45b}.arena{position:relative;overflow:hidden;height:min(55svh,390px);min-height:260px;border:3px solid #d5f45b;border-radius:14px;background:linear-gradient(#ef9a62 0 28%,#6b8b5a 28% 55%,#4b3d2c 55%);touch-action:manipulation}.sun{position:absolute;right:12%;top:9%;font-size:42px}.gate{position:absolute;top:18%;left:35%;width:30%;height:57%;border:8px solid #e4d5ad;border-bottom:0;background:repeating-linear-gradient(90deg,#6b3026 0 12px,#b55a3d 12px 20px)}.guard{position:absolute;bottom:20%;font-size:42px;transition:left .12s}.eric{position:absolute;bottom:5%;left:8%;font-size:38px;transition:left .12s}.hud{display:flex;justify-content:space-between;gap:10px;margin:12px 0;font-weight:700}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{border:2px solid #7f591c;background:#f5b83d;color:#17170e;border-radius:10px;padding:13px 20px;font-size:18px;font-weight:800;min-height:48px}.hint{color:#d5d0bf;font-size:15px}
</style></head><body><main class="game"><a class="back" href="../index.html#games">← All games</a><h1>GATECRASH</h1><p>Slip past security and sneak into the festival. Move when the guard looks away!</p><div class="hud"><span id="status">Ready to sneak</span><span>Score: <b id="score">0</b></span></div><div class="arena" id="arena"><span class="sun">☀️</span><div class="gate"></div><span class="guard" id="guard" style="left:65%">🕴️</span><span class="eric" id="eric">🪱</span></div><p class="hint">Tap SNEAK to move forward. If the guard catches you moving, start again.</p><div class="controls"><button id="sneak">SNEAK →</button><button id="restart">START AGAIN</button></div></main><script>
const eric=document.querySelector('#eric'),guard=document.querySelector('#guard'),status=document.querySelector('#status'),scoreEl=document.querySelector('#score'),sneak=document.querySelector('#sneak');let x=8,score=0,watching=false,over=false;function patrol(){if(over)return;watching=!watching;guard.textContent=watching?'👀':'🕴️';guard.style.left=watching?'63%':'27%';status.textContent=watching?'GUARD IS WATCHING!':'Guard looking away — move!';setTimeout(patrol,900+Math.random()*900)}function reset(){x=8;score=0;over=false;watching=false;eric.style.left=x+'%';scoreEl.textContent=score;status.textContent='Ready to sneak';sneak.disabled=false;guard.textContent='🕴️';patrol()}sneak.onclick=()=>{if(over)return;if(watching){status.textContent='CAUGHT! The guard spotted you.';over=true;sneak.disabled=true;return}x+=9;score+=1;eric.style.left=Math.min(x,83)+'%';scoreEl.textContent=score;if(x>=80){status.textContent='YOU MADE IT! Festival gate crashed! 🎉';over=true;sneak.disabled=true}};document.querySelector('#restart').onclick=reset;reset();</script></body></html>
