<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rufetch — WORMS ON ACID</title><style>
*{box-sizing:border-box}body{margin:0;background:#101713;color:#f5e8c7;font:18px system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:16px}.game{width:min(100%,680px);text-align:center}.back{color:#d5f45b}.yard{height:300px;position:relative;overflow:hidden;border:3px solid #d5f45b;border-radius:14px;background:linear-gradient(#b8d4d8 0 45%,#668c4d 45% 100%);touch-action:manipulation}.dog{position:absolute;bottom:20px;left:8%;font-size:54px;transition:left .12s}.ticket{position:absolute;font-size:38px;top:30%;left:70%;transition:top .12s,left .12s}.obstacle{position:absolute;bottom:20px;left:48%;font-size:44px}.hud{display:flex;justify-content:space-between;margin:12px 0;color:#d5f45b;font-weight:800}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{padding:13px 20px;min-height:48px;border-radius:10px;border:2px solid #80510f;background:#f5b83d;color:#17170e;font-size:18px;font-weight:800}.note{font-size:15px;color:#d5d0bf}
</style></head><body><main class="game"><a class="back" href="../index.html#games">← All games</a><h1>RUFETCH</h1><p>Nigel threw a stick. Rufus found a ticket. Naturally.</p><div class="hud"><span id="status">Catch the runaway ticket!</span><span>Score: <b id="score">0</b></span></div><div class="yard" id="yard"><span class="ticket" id="ticket">🎟️</span><span class="obstacle">🪵</span><span class="dog" id="dog">🦈🐾</span></div><p class="note">Use the arrows to chase the ticket. Grab it before it blows away!</p><div class="controls"><button id="left">← LEFT</button><button id="catch">FETCH!</button><button id="right">RIGHT →</button><button id="restart">AGAIN</button></div></main><script>
const dog=document.querySelector('#dog'),ticket=document.querySelector('#ticket'),status=document.querySelector('#status'),scoreEl=document.querySelector('#score');let dx=8,tx=70,ty=30,score=0,over=false,timer;function place(){dog.style.left=dx+'%';ticket.style.left=tx+'%';ticket.style.top=ty+'%'}function drift(){if(over)return;tx=5+Math.random()*85;ty=15+Math.random()*55;place();timer=setTimeout(drift,1900)}function move(n){if(over)return;dx=Math.max(0,Math.min(85,dx+n));place();if(Math.abs(dx-tx)<12&&Math.abs(70-ty)<50){score++;scoreEl.textContent=score;status.textContent='Rufus got it! (It is not a stick.)';tx=5+Math.random()*85;ty=15+Math.random()*55;place()}}document.querySelector('#left').onclick=()=>move(-10);document.querySelector('#right').onclick=()=>move(10);document.querySelector('#catch').onclick=()=>{if(Math.abs(dx-tx)<15){score++;scoreEl.textContent=score;status.textContent='FETCH! Rufus is very proud.';tx=5+Math.random()*85;ty=15+Math.random()*55;place()}else status.textContent='Rufus is chasing the wrong thing.'};document.querySelector('#restart').onclick=()=>{clearTimeout(timer);dx=8;score=0;over=false;scoreEl.textContent=0;status.textContent='Catch the runaway ticket!';place();drift()};place();drift();</script></body></html>
