<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tappy Split</title>
<style>
:root{--bg:#efe6d4;--fg:#2a1d14;--btn:#d9c7a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120d;--fg:#f0e4d0;--btn:#33291d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17120d;--fg:#f0e4d0;--btn:#33291d;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none}
#hud{display:flex;gap:18px;font-size:17px}
canvas{border-radius:10px;touch-action:none;box-shadow:0 0 0 3px #2a1a12}
#pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
#pad button{height:46px;border:0;border-radius:10px;background:var(--btn);color:var(--fg);font-size:20px;touch-action:manipulation}
</style></head><body>
<div id="hud"><span>Score <b id="sc">0</b></span><span>Best <b id="bs">0</b></span><span>Tappys <b id="pc">1</b></span></div>
<canvas id="c"></canvas>
<div id="pad"><span></span><button data-d="U">▲</button><span></span><button data-d="L">◀</button><button data-d="D">▼</button><button data-d="R">▶</button></div>
<script>
const N=15,cv=document.getElementById('c'),x=cv.getContext('2d');
let S,C;
function fit(){const w=Math.min(innerWidth*.94,innerHeight*.52,420),r=devicePixelRatio||1;cv.style.width=cv.style.height=w+'px';cv.width=cv.height=w*r;S=w*r;C=S/N}
addEventListener('resize',fit);fit();
const V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
let pcs=[],foods=[],hits=[],fx=[],want=[1,0],score=0,best=0,state='idle',last=0,acc=0,nextHit=0,overAt=0;
const wr=v=>(v+N)%N;
const dl=(a,b)=>{let d=a-b;return d>1?-1:d<-1?1:d};
const mk=(segs,dir)=>({segs,dir,blink:0});
const dirOf=s=>[dl(s[0].x,s[1].x),dl(s[0].y,s[1].y)];
const occ=(a,b)=>pcs.some(p=>p.segs.some(s=>s.x===a&&s.y===b))||foods.some(f=>f.x===a&&f.y===b);
function spawn(){for(let t=0;t<200;t++){const a=Math.random()*N|0,b=Math.random()*N|0;if(!occ(a,b)){foods.push({x:a,y:b});return}}}
function reset(){pcs=[mk([{x:7,y:7},{x:6,y:7},{x:5,y:7},{x:4,y:7}],[1,0])];foods=[];hits=[];fx=[];want=[1,0];score=0;for(let i=0;i<3;i++)spawn();nextHit=performance.now()+2500;state='play';acc=0}
function step(){
  for(const p of pcs){if(want[0]+p.dir[0]===0&&want[1]+p.dir[1]===0)continue;p.dir=want}
  for(const p of [...pcs]){
    if(!pcs.includes(p))continue;
    const h=p.segs[0],nx=wr(h.x+p.dir[0]),ny=wr(h.y+p.dir[1]);
    const fi=foods.findIndex(f=>f.x===nx&&f.y===ny);
    let blocked=false,fuse=null;
    for(const q of pcs){const L=q.segs.length;
      for(let i=0;i<L;i++){const s=q.segs[i];if(s.x!==nx||s.y!==ny)continue;
        if(q===p){if(!(i===L-1&&fi<0))blocked=true}
        else if(i===L-1)fuse=q;else blocked=true}}
    if(fuse){fuse.segs=fuse.segs.concat(p.segs);pcs.splice(pcs.indexOf(p),1);score+=50;fx.push({x:nx,y:ny,k:'f',t:performance.now()});continue}
    if(blocked)continue;
    p.segs.unshift({x:nx,y:ny});
    if(fi>=0){foods.splice(fi,1);score+=10;spawn()}else p.segs.pop();
  }
}
function strike(c){
  fx.push({x:c.x,y:c.y,k:'h',t:performance.now()});
  for(const p of [...pcs]){
    const i=p.segs.findIndex(s=>s.x===c.x&&s.y===c.y);if(i<0)continue;
    const L=p.segs.slice(0,i),R=p.segs.slice(i+1).reverse();
    pcs.splice(pcs.indexOf(p),1);
    if(L.length>=2){p.segs=L;p.blink=10;pcs.push(p)}
    if(R.length>=2){const n=mk(R,dirOf(R));n.blink=10;pcs.push(n)}
  }
  if(!pcs.length){state='over';overAt=performance.now();best=Math.max(best,score)}
}
function tick(now){
  const dt=Math.min(now-last,100);last=now;
  if(state==='play'){
    acc+=dt;const ms=Math.max(95,170-score/6);
    while(acc>=ms&&state==='play'){acc-=ms;step();for(const p of pcs)if(p.blink>0)p.blink--}
    if(now>nextHit){const p=pcs[Math.random()*pcs.length|0];
      let t;if(Math.random()<.75&&p){t={...p.segs[Math.random()*p.segs.length|0]}}else t={x:Math.random()*N|0,y:Math.random()*N|0};
      t.at=now+900;t.s=now;hits.push(t);nextHit=now+Math.max(900,2600-score*8)}
    for(const h of [...hits])if(now>=h.at){hits.splice(hits.indexOf(h),1);strike(h);if(state!=='play')break}
  }
  draw(now);requestAnimationFrame(tick);
}
function draw(now){
  for(let a=0;a<N;a++)for(let b=0;b<N;b++){x.fillStyle=(a+b)%2?'#6a4a2d':'#654529';x.fillRect(a*C,b*C,C+1,C+1)}
  x.textAlign='center';x.textBaseline='middle';x.font=C*.8+'px serif';
  for(const f of foods)x.fillText('🍎',(f.x+.5)*C,(f.y+.55)*C);
  for(const h of hits){const k=(now-h.s)/900;x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse((h.x+.5)*C,(h.y+.5)*C,C*(.2+.35*k),C*(.15+.25*k),0,0,7);x.fill();
    x.strokeStyle='rgba(255,70,50,'+(.4+.6*k)+')';x.lineWidth=C*.08;x.beginPath();x.arc((h.x+.5)*C,(h.y+.5)*C,C*.5,0,7);x.stroke()}
  for(const p of pcs)worm(p);
  fx=fx.filter(f=>now-f.t<450);
  for(const f of fx){const k=(now-f.t)/450;
    if(f.k==='h'){x.globalAlpha=1-k;x.font=C*1.3+'px serif';x.fillText('🐦',(f.x+.5)*C,(f.y+.5-.4*k)*C);x.globalAlpha=1}
    else{x.strokeStyle='rgba(255,230,90,'+(1-k)+')';x.lineWidth=C*.12;x.beginPath();x.arc((f.x+.5)*C,(f.y+.5)*C,C*(.4+1.2*k),0,7);x.stroke()}}
  if(state!=='play'){x.fillStyle='rgba(20,12,8,.72)';x.fillRect(0,0,S,S);x.fillStyle='#f6dfc4';
    x.font='bold '+C*1.3+'px Georgia,serif';x.fillText(state==='over'?'Tappy is toast':'Tappy Split',S/2,S*.34);
    x.font=C*.62+'px Georgia,serif';
    const L=state==='over'?['Score '+score,'Tap to try again']:['Birds peck where the red ring is.','Hit = Tappy splits. Touch a tail to fuse.','Swipe or tap arrows. Tap to start.'];
    L.forEach((t,i)=>x.fillText(t,S/2,S*.5+i*C*.95))}
  document.getElementById('sc').textContent=score;document.getElementById('bs').textContent=best;document.getElementById('pc').textContent=pcs.length;
}
function worm(p){
  const s=p.segs,r=C*.36;x.lineCap=x.lineJoin='round';
  for(const pass of [0,1]){
    for(let i=s.length-1;i>0;i--){
      const a=s[i],b=s[i-1];if(Math.abs(a.x-b.x)>1||Math.abs(a.y-b.y)>1)continue;
      const taper=i>=s.length-2?.7:1;
      x.strokeStyle=pass?'#f4a9c9':'#2a1420';x.lineWidth=(r*2*taper)+(pass?0:C*.1);
      x.beginPath();x.moveTo((a.x+.5)*C,(a.y+.5)*C);x.lineTo((b.x+.5)*C,(b.y+.5)*C);x.stroke()}
    if(!pass)for(const q of s){x.fillStyle='#2a1420';x.beginPath();x.arc((q.x+.5)*C,(q.y+.5)*C,r+C*.05,0,7);x.fill()}
    else for(let i=1;i<s.length;i++){const q=s[i];x.fillStyle='#f4a9c9';x.beginPath();x.arc((q.x+.5)*C,(q.y+.5)*C,r*(i>=s.length-1?.7:1),0,7);x.fill();
      x.strokeStyle='#c46e98';x.lineWidth=C*.05;const px=p.dir[1]?1:0,py=p.dir[0]?1:0,cx=(q.x+.5)*C,cy=(q.y+.5)*C;
      x.beginPath();x.moveTo(cx-px*r*.8,cy-py*r*.8);x.lineTo(cx+px*r*.8,cy+py*r*.8);x.stroke()}
  }
  const h=s[0],cx=(h.x+.5)*C,cy=(h.y+.5)*C,hr=C*.56;
  x.fillStyle='#2a1420';x.beginPath();x.arc(cx,cy,hr+C*.05,0,7);x.fill();
  x.fillStyle='#f4a9c9';x.beginPath();x.arc(cx,cy,hr,0,7);x.fill();
  const er=C*.4;x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,er,0,7);x.fill();
  x.fillStyle='#5b86c8';x.beginPath();x.arc(cx+p.dir[0]*C*.1,cy+p.dir[1]*C*.1,er*.55,0,7);x.fill();
  x.fillStyle='#111';x.beginPath();x.arc(cx+p.dir[0]*C*.13,cy+p.dir[1]*C*.13,er*.27,0,7);x.fill();
  x.save();x.beginPath();x.arc(cx,cy,er,0,7);x.clip();x.fillStyle='#2a1420';
  x.fillRect(cx-er,cy-er,er*2,er*(p.blink>0?1.5:.5));x.restore();
}
function dir(d){want=V[d]}
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();dir(b.dataset.d);go()}));
function go(){if(state!=='play'&&performance.now()-overAt>600)reset()}
let sx,sy;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;go()});
cv.addEventListener('pointermove',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))>22){dir(Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'));sx=e.clientX;sy=e.clientY}});
addEventListener('pointerup',()=>sx=null);
addEventListener('keydown',e=>{const m={ArrowUp:'U',w:'U',ArrowDown:'D',s:'D',ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R'}[e.key];
  if(m){e.preventDefault();dir(m);go()}else if(e.key===' ')go()});
requestAnimationFrame(t=>{last=t;tick(t)});
</script></body></html>
